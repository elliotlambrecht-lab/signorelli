<style>
/* Layout: phone-first single column; code screen, then four views (me, shop, pod, Signorelli) */
:root{--bg:#FAF7F0;--panel:#FFFFFF;--ink:#22424F;--muted:#5B6F77;--line:#E3D8C2;--sand:#EFE6D3;--accent:#A9532F;--gold:#C8AE79;--good:#2F7D5B;--bad:#B23B3B;
--display:'Yanone Kaffeesatz',Oswald,'Arial Narrow',sans-serif;--body:Lato,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13232A;--panel:#1A2F37;--ink:#EDE6D6;--muted:#A8B8BD;--line:#2E4650;--sand:#22383F;--accent:#E39A72;--gold:#D8C08F;--good:#5BC08F;--bad:#E57373;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13232A;--panel:#1A2F37;--ink:#EDE6D6;--muted:#A8B8BD;--line:#2E4650;--sand:#22383F;--accent:#E39A72;--gold:#D8C08F;--good:#5BC08F;--bad:#E57373;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--display);font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--accent);font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;letter-spacing:1.5px;text-transform:uppercase;margin:0;text-wrap:balance}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--ink);color:var(--bg);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .lbl{color:inherit;opacity:.8}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.banner{border:1px dashed var(--gold);background:var(--sand);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;background:var(--sand);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--ink);font:600 14px var(--display);letter-spacing:.5px;white-space:normal;line-height:1.1;padding:4px 2px;text-transform:uppercase;min-height:44px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ladder{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.ladder i{height:28px;border-radius:4px;background:var(--sand);display:flex;align-items:end;justify-content:center;font-style:normal;font-size:10px;color:var(--muted);padding-bottom:2px}
.ladder i.on{background:var(--good);color:#fff}
.ladder i.next{outline:2px dashed var(--good);outline-offset:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sand)}
.bar{height:12px;border-radius:6px;background:var(--sand);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days span{aspect-ratio:1;border-radius:6px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.days span.hit{background:var(--good);color:#fff}.days span.miss{background:var(--line)}
input{font:700 22px var(--body);letter-spacing:3px;text-transform:uppercase;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%;box-sizing:border-box}
.btn{font:600 18px var(--display);letter-spacing:2px;text-transform:uppercase;background:var(--accent);color:#fff;border:0;border-radius:10px;min-height:48px;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:14px}
.num{font-variant-numeric:tabular-nums}
label.check{display:flex;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const P=window.__P;
const money=v=>'£'+(Math.round(v*100)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const k=v=>'£'+Math.round(v).toLocaleString('en-GB');
const pct=v=>(v>0?'+':'')+v.toFixed(1)+'%';
const fd=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==='class')e.className=y;else e.setAttribute(x,y)}for(const z of c)if(z!=null)e.append(z);return e};
const app=document.getElementById('app');
function setFoot(){document.getElementById('foot').textContent='Sales up to '+fd(P.last)+'. Updated '+fd(P.pulled)+'. Questions about your pay: ask your shop manager.';}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  code=code.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(code.length<8) return null;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(P.salt),iterations:P.iter,hash:'SHA-256'},base,384));
  const id=[...bits.slice(32)].map(b=>b.toString(16).padStart(2,'0')).join(''); const rec=P.people[id]; if(!rec) return null;
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(rec[0])},key,b64(rec[1]));
  const me=JSON.parse(new TextDecoder().decode(pt).trim());
  if(P.shared&&!P.team){const k2=await crypto.subtle.importKey('raw',b64(me.k),{name:'AES-GCM'},false,['decrypt']);
    Object.assign(P,JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.shared[0])},k2,b64(P.shared[1])))));setFoot();}
  return me;
}
function level(r){if(r>=50)return['On fire','Your team is flying'];if(r>=21)return['Strong','Keep it going'];if(r>0)return['On the board','Every 1% adds 7p an hour'];return['Warming up','Beat the target to start earning']}
function ladder(growth){const l=el('div',{class:'ladder'});for(let i=1;i<=10;i++){const c=growth>=i?'on':(Math.floor(Math.max(growth,0))+1===i?'next':'');l.append(el('i',{class:c},i*7+'p'))}return l}
function teamCard(t,title){
  const T=P.team[t]; const c=el('div',{class:'card pop'});
  c.append(el('div',{class:'row'},el('span',{class:'lbl'},title),el('span',{class:'chip'},level(T.rate)[0])));
  c.append(el('div',{class:'row'},el('span',{class:'mid'},pct(T.growth)),el('span',{class:'small num'},k(T.sales)+' sold · target '+k(T.target))));
  c.append(el('div',{class:'small'},'Team pay this month: '+T.rate.toFixed(1)+'p an hour. Each box is 1% above target.'));
  c.append(ladder(T.growth));
  if(T.streak>0) c.append(el('div',{class:'chip'},T.streak+' day'+(T.streak>1?'s':'')+' in a row above target'));
  return c;
}
function storeCard(s){
  const S=P.store[s]; const c=el('div',{class:'card pop'});
  c.append(el('div',{class:'row'},el('span',{class:'lbl'},s+' this month'),el('span',{class:'mid'},S.growth==null?'–':pct(S.growth))));
  c.append(el('div',{class:'bar'},el('i',{style:'width:'+Math.min(100,100*S.sales/Math.max(S.target,1)/1.15)+'%'})));
  c.append(el('div',{class:'small num'},k(S.sales)+' sold so far, target '+k(S.target)));
  const d=el('div',{class:'days'}); const first=new Date(S.daily[0][0]+'T12:00:00Z').getUTCDay(); const pad=(first+6)%7;
  for(let i=0;i<pad;i++)d.append(el('span',{style:'background:transparent'}));
  S.daily.forEach(([dd,a,t])=>{const cl=t===0?'':(a>=t?'hit':'miss');d.append(el('span',{class:cl,title:fd(dd)+': '+k(a)+' vs '+k(t)},String(+dd.slice(8))))});
  c.append(el('div',{class:'lbl'},'Days above target (green)'),d);
  return c;
}
function view(me,tab){
  app.innerHTML='';
  app.append(el('h1',{},'Hi '+me.name));
  const started=P.last>=P.month_end.slice(0,8)+'01';
  if(P.month_end<'2026-11-01') app.append(el('div',{class:'banner'},el('strong',{},'The bonus starts in November. '),P.month+' is a practice run: nothing is paid for it. A November number shows up here after the first trading day of November.'));
  else if(!started) app.append(el('div',{class:'banner'},el('strong',{},P.month+' has just started. '),'Your number shows up here after the first trading day.'));
  const isPod=P.team[me.team].stores.length>1;
  const T=[['me','Me'],['shop','Shop']].concat(isPod?[['pod','Shop group']]:[]).concat([['all','All shops']]);
  const tb=el('div',{class:'tabs',role:'tablist'});
  T.forEach(([key,l])=>{const b=el('button',{type:'button',role:'tab','aria-selected':String(tab===key)},l);b.onclick=()=>view(me,key);tb.append(b)});
  app.append(tb);
  const rate=P.team[me.team].rate+P.group.rate;
  if(tab==='me'){
    const TT=P.team[me.team], tip=me.tip, gr=P.group.rate;
    const mname=P.month.split(' ')[0], endd=fd(P.month_end);
    const dueNow=Math.round(TT.sales/(1+TT.growth/100)), above=TT.sales-dueNow;
    const per100=me.home_proj_hours*0.07/(TT.month_target/100)*100;
    const teamName=TT.stores.join(' + ');
    // 1. targets
    const t=el('div',{class:'card pop'});
    t.append(el('span',{class:'lbl'},'1 · Your team\'s targets ('+teamName+')'));
    t.append(el('div',{class:'row'},el('span',{},el('strong',{},mname)),el('span',{class:'mid'},k(TT.month_target))));
    const cm=(P.coming||{})[me.team]; if(cm) Object.entries(cm).forEach(([m,v])=>t.append(el('div',{class:'row'},el('span',{},m.split(' ')[0]),el('span',{class:'num'},k(v)))));
    t.append(el('div',{class:'small'},'Each target is for the whole month. Only the total on the last day of the month counts.'));
    if(me.team==='Broadgate'&&P.month_end<'2026-12-01') t.append(el('div',{class:'small'},'Why November is lower than October: from November the target follows Broadgate\'s real sales so far plus 4%, instead of the opening plan.'));
    app.append(t);
    // 2. what I earn on this month's trend
    const h=el('div',{class:'hero pop'});
    const prac=P.month_end<'2026-11-01';
    h.append(el('span',{class:'lbl'},prac?'2 · Practice: what you would have got':'2 · If the team keeps this month\'s pace'),el('span',{class:'big'},started?money(me.earn_proj):'–'),
      el('span',{class:'small',style:'color:inherit;opacity:.9;font-weight:700'},'Sales up to '+fd(P.last)),
      el('span',{},prac?'if '+mname+' counted and the team keeps this pace. Nothing is paid for '+mname+': it is a practice month.':'extra for you in '+mname+', on top of your normal pay, if the team keeps this pace'));
    if(started)h.append(el('span',{class:'small',style:'color:inherit;opacity:.9'},'So far the team has sold '+k(TT.sales)+'. At this pace it ends the month on about '+k(TT.proj_sales)+': '+(TT.growth>=0?Math.abs(TT.growth).toFixed(1)+'% above':Math.abs(TT.growth).toFixed(1)+'% below')+' the '+k(TT.month_target)+' target. This is an estimate and changes every day; the real figure is worked out on '+endd+'.'));
    if(!started){} else if(TT.growth>=0) h.append(el('span',{class:'small',style:'color:inherit;opacity:.9'},'Above target, every extra £100 the team sells adds about '+money(per100)+(prac?' to what you would get.':' to your pay.')));
    else h.append(el('span',{class:'small',style:'color:inherit;opacity:.9'},'The team needs about '+k(TT.month_target-TT.proj_sales)+' more by '+endd+' to reach the target. After that, every extra £100 adds about '+money(per100)+(prac?' to what you would get.':' to your pay.')));
    h.append(el('span',{class:'small',style:'color:inherit;opacity:.9'},'Your extra pay per hour as the team gets further above target:'));
    h.append(ladder(TT.growth));
    app.append(h);
    // 3. how to increase it (updates with the time of day, London time)
    const f=el('div',{class:'card pop'});
    const drawTips=()=>{f.innerHTML='';
      const lon=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/London'})), hr=lon.getHours(), summer=[4,5,6,7,8].includes(lon.getMonth());
      const SLOTS=[['Until 11am','"Would you like a croissant with that coffee?"',hr<11],['11am to 2pm','"Would you like that in a meal deal?"',hr>=11&&hr<14],['2pm to close','"Would you like a cookie to go with that?"',hr>=14]];
      f.append(el('span',{class:'lbl'},'3 · How to make this number bigger'));
      f.append(el('div',{},'Ask these on every coffee. More sales for the team means more pay for you.'));
      const nowS=SLOTS.find(x=>x[2]);
      f.append(el('div',{style:'background:var(--sand);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px'},
        el('span',{class:'lbl'},'Right now ('+nowS[0].toLowerCase()+')'),el('strong',{style:'font-size:20px;line-height:1.2'},nowS[1])));
      [['Always','"Was that a large cup?"'],['Always','"Any syrup with that?"']].concat(summer?[['Summer','"Would you like that iced?"']]:[]).forEach(([w,q])=>
        f.append(el('div',{style:'display:flex;gap:12px;align-items:baseline;padding:2px 12px'},el('span',{class:'lbl',style:'flex:0 0 64px'},w),el('strong',{style:'font-size:17px'},q))));
      f.append(el('div',{class:'small',style:'padding:0 12px'},'The "right now" question changes by itself during the day: croissant until 11am, meal deal from 11am to 2pm, cookie from 2pm. "Iced?" shows from May to September.'));
      const gNow=TT.rate>0?TT.rate/7:TT.growth, gAfter=gNow+100*tip.extra_sales/TT.month_target, rAfter=Math.min(70,7*Math.max(0,gAfter)); tip.gain=Math.max(0,(rAfter-TT.rate)/100*me.home_proj_hours); tip.growth_after=gAfter;
      if(!started){} else if(tip.growth_after>=0&&tip.gain>=0.5) f.append(el('div',{class:'row'},el('span',{},'If 1 more coffee customer in 10 says yes to food for the rest of '+mname),el('span',{class:'mid',style:'color:var(--good)'},'+'+money(tip.gain)+' for you')));
      else if(tip.growth_after<0) f.append(el('div',{class:'small'},'If 1 more coffee customer in 10 says yes to food for the rest of '+mname+', the team gets '+k(tip.extra_sales)+' closer to its target.'));
    };
    drawTips(); app.append(f);
    clearInterval(window.__tipT); window.__tipT=setInterval(()=>{if(document.body.contains(f))drawTips();else clearInterval(window.__tipT)},60000);
    // 4. how pay is worked out
    const s2=el('div',{class:'card pop'});
    s2.append(el('span',{class:'lbl'},'4 · How your extra pay is worked out'));
    const steps=['At the end of the month we compare your team\'s sales with its target.',
      'For every 1% the team is above target, each hour you worked earns 7p extra (up to 70p an hour at 10% above).',
      'If all Signorelli shops together are above target, everyone also gets 1.5p an hour for every 1% (up to 15p).',
      'Your extra pay = the hours you worked × those two rates. From November, it is paid with the next month\'s pay.'];
    const ol=el('ol',{style:'margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px'}); steps.forEach(x=>ol.append(el('li',{},x))); s2.append(ol);
    const rt=TT.rate+gr;
    if(started)s2.append(el('div',{style:'background:var(--sand);border-radius:6px;padding:10px 12px'},el('strong',{},'You, this month (estimate): '),
      'team '+(TT.growth>=0?Math.abs(TT.growth).toFixed(1)+'% above':'below')+' target = '+TT.rate.toFixed(1)+'p, plus Signorelli '+gr.toFixed(1)+'p = '+rt.toFixed(1)+'p an hour × about '+Math.round(me.home_proj_hours)+' hours in your team\'s shops'+(me.proj_hours-me.home_proj_hours>=1?(()=>{const o=Math.max(0,me.earn_proj-me.home_proj_hours*rt/100);return o<0.005?', plus about '+Math.round(me.proj_hours-me.home_proj_hours)+' hours in other shops (that team is below target, so nothing yet)':', plus '+money(o)+' for about '+Math.round(me.proj_hours-me.home_proj_hours)+' hours in other shops'})():'')+' = about '+money(me.earn_proj)+'.'));
    const d=el('details'); d.append(el('summary',{class:'small',style:'cursor:pointer'},'Your hours by shop so far'));
    Object.entries(me.by_shop).forEach(([sh,hh])=>{const r=P.team[P.pod_of[sh]].rate+gr;d.append(el('div',{class:'row'},el('span',{},sh),el('span',{class:'num'},hh+' h × '+r.toFixed(1)+'p = '+money(hh*r/100))))});
    d.append(el('div',{class:'small'},'If you work in another team\'s shop, those hours earn that team\'s rate. Holiday hours do not count.'));
    s2.append(d); app.append(s2);
  } else if(tab==='shop'){ app.append(storeCard(me.home)); if(!isPod) app.append(teamCard(me.team,'Your team')); }
  else if(tab==='pod'){ app.append(teamCard(me.team,'Your shop group: '+P.team[me.team].stores.join(' + '))); P.team[me.team].stores.forEach(s=>app.append(storeCard(s))); }
  else {
    const g=el('div',{class:'hero pop'}); g.append(el('span',{class:'lbl'},'All of Signorelli this month'),el('span',{class:'big'},pct(P.group.growth)),
      el('span',{class:'num'},k(P.group.sales)+' sold · target '+k(P.group.target)),el('span',{},'Signorelli rate for everyone: '+P.group.rate.toFixed(1)+'p an hour (1.5p for every 1%, up to 15p)'));
    app.append(g);
    const ranks=Object.entries(P.team).sort((a,b)=>b[1].growth-a[1].growth); const c=el('div',{class:'card'}); c.append(el('span',{class:'lbl'},'Team table'));
    ranks.forEach(([t,v],i)=>c.append(el('div',{class:'row'},el('span',{},(i+1)+'. '+t),el('span',{class:'num'},pct(v.growth)+' · '+v.rate.toFixed(1)+'p'))));
    app.append(c);
  }
  app.append(el('div',{class:'card',style:'text-align:center;gap:6px'},el('div',{style:'font-size:26px'},'☕ 🥐 🍪'),el('strong',{},'This page is brand new, and it is for you.'),el('div',{class:'small'},'Please do not hesitate to give us feedback to improve it. Something unclear, a number that looks wrong, or an idea? Tell your shop manager: we read every one.')));
  const out=el('button',{type:'button',class:'small',style:'background:none;border:0;text-decoration:underline;color:var(--muted);cursor:pointer;min-height:44px;justify-self:start'},'Log out');
  out.onclick=()=>{try{localStorage.removeItem('sgcode')}catch(e){};login()};app.append(out);
}
function login(msg){
  app.innerHTML='';
  app.append(el('h1',{},'Your team bonus'));
  app.append(el('div',{},'See what you have earned this month, how your shop and team are doing, and how close you are to the next level.'));
  const f=el('form',{class:'card'}); const lab=el('label',{for:'code',class:'lbl'},'Your personal code');
  const inp=el('input',{id:'code',autocomplete:'off',autocapitalize:'characters',spellcheck:'false',placeholder:'XXXX-XXXX-XXXX'});
  const rem=el('input',{type:'checkbox',id:'rem'}); rem.style.width='auto';
  const btn=el('button',{type:'submit',class:'btn'},'Show my bonus');
  f.append(lab,inp,el('label',{class:'check',for:'rem'},rem,'Remember me (only on your own phone)'),btn);
  if(msg) f.append(el('div',{class:'err'},msg));
  f.append(el('div',{class:'small'},'Your code is private: do not share it. Lost it? Ask your shop manager for a new one.'));
  f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Opening…';
    try{const me=await unlock(inp.value);if(!me){btn.disabled=false;btn.textContent='Show my bonus';return login('That code was not found. Check it and try again.')}
      if(rem.checked){try{localStorage.setItem('sgcode',inp.value.trim().toUpperCase())}catch(e){}}else{try{localStorage.removeItem('sgcode')}catch(e){}} view(me,'me')}
    catch(err){login('Something went wrong opening your figures. Try again.')}};
  app.append(f);
}
(async()=>{let c=null;const hc=decodeURIComponent((location.hash||'').slice(1)).replace(/^code=/,'');
  if(hc){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  let c1=null;try{c1=sessionStorage.getItem('sgcode1');sessionStorage.removeItem('sgcode1')}catch(e){}
  if(c1){try{const me=await unlock(c1);if(me)return view(me,'me')}catch(e){} return login('That code was not found. Check it and try again.')}
  if(hc.replace(/[^A-Za-z0-9]/g,'').length===12){try{const me=await unlock(hc);if(me)return view(me,'me')}catch(e){} return login('This link did not work. Type your code below or ask your shop manager.')}
  if(hc) return login('That code is too short. A code has 12 letters and numbers.');
  try{c=localStorage.getItem('sgcode')}catch(e){}
  if(c){try{const me=await unlock(c);if(me)return view(me,'me')}catch(e){}} login()})();
</script>
