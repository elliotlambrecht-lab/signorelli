<title>Signorelli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@400;600&family=Lato:wght@400;700&display=swap">
<style>:root{--bg:#FAF7F0;--panel:#fff;--ink:#22424F;--muted:#5B6F77;--line:#E3D8C2;--accent:#A9532F;--bad:#B23B3B}
@media (prefers-color-scheme:dark){:root{--bg:#13232A;--panel:#1A2F37;--ink:#EDE6D6;--muted:#A8B8BD;--line:#2E4650;--accent:#E39A72;--bad:#E57373}}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:16px Lato,Arial,sans-serif;margin:0}
.w{max-width:460px;margin:8vh auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.b{font:600 14px 'Yanone Kaffeesatz',sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--accent)}
h1{font:400 40px 'Yanone Kaffeesatz',sans-serif;text-transform:uppercase;margin:0;line-height:1}
.q{font-size:18px;font-weight:700;margin-top:6px}
.who{display:flex;flex-direction:column;gap:10px}
.who button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:16px;min-height:64px;cursor:pointer;font:inherit}
.who button:hover,.who button:focus-visible{border-color:var(--accent);outline:none}
.who b{font:400 26px 'Yanone Kaffeesatz',sans-serif;letter-spacing:1px;text-transform:uppercase}
.who span{color:var(--muted);font-size:14px}
label{font-weight:700}
input{font:700 20px Lato,sans-serif;letter-spacing:3px;text-transform:uppercase;padding:12px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);width:100%}
.go{font:600 18px 'Yanone Kaffeesatz',sans-serif;letter-spacing:2px;text-transform:uppercase;background:var(--accent);color:#fff;border:0;border-radius:10px;min-height:52px;cursor:pointer}
.back{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;align-self:flex-start;min-height:44px}
.e{color:var(--bad);font-weight:700;min-height:1.2em}.n{font-size:13px;color:var(--muted)}
</style></head><body>

const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==='class')e.className=y;else if(x.startsWith('on'))e[x]=y;else e.setAttribute(x,y)}for(const c of k)if(c!=null)e.append(c);return e};
const ROLES=[['owner','Rebecca and Elliot','Everything: cash, profitability, operations, managers and store staff'],
             ['manager','Manager','Manager pages and store staff pages'],
             ['shop','Store staff','Front of house, kitchen, or check your own bonus']];
const STAFF=[['foh','Front of house','The shop iPad: checklists, fridge log, end of day','Shop password','foh.html'],
             ['kitchen','Kitchen','The kitchen screen: dispatch, cleaning, events','Shop password','kitchen.html'],
             ['me','My bonus','Check your own bonus and how your shop and pod are doing','Your personal code','me.html']];
const clean=pw=>pw.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
async function check(role,pw){const v=V[role];if(!v)throw 0;
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(v[0]),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v[1])},k,b64(v[2]));}
async function tryRole(role,pw){const v=V[role];if(!v)throw 0;
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(v[0]),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v[1])},k,b64(v[2])));
 try{sessionStorage.setItem('sgm',pw);sessionStorage.setItem('sgrole',role);sessionStorage.setItem('sgt',String(Date.now()))}catch(e){}
 try{history.replaceState(null,'',location.pathname)}catch(e){}
 document.open();document.write(h);document.close();}
function step1(){w.innerHTML='';
 w.append(el('div',{class:'b'},'Signorelli'),el('h1',{},'Welcome'),el('div',{class:'q'},'Who is logging in?'));
 const g=el('div',{class:'who'});ROLES.forEach(([k,t,d])=>g.append(el('button',{type:'button',onclick:()=>k==='shop'?stepStaff():step2(k)},el('b',{},t),el('span',{},d))));w.append(g);}
function stepStaff(){w.innerHTML='';
 w.append(el('div',{class:'b'},'Signorelli · Store staff'),el('h1',{},'Store staff'),el('div',{class:'q'},'Where are you working?'));
 const g=el('div',{class:'who'});STAFF.forEach(x=>g.append(el('button',{type:'button',onclick:()=>step3(x)},el('b',{},x[1]),el('span',{},x[2]))));
 w.append(g,el('button',{type:'button',class:'back',onclick:step1},'← Someone else is logging in'));}
function step3(x){w.innerHTML='';const [k,t,d,lab,url]=x;
 const f=el('form',{class:'w',style:'margin:0;padding:0'});
 const inp=el('input',{id:'p',autocomplete:'current-password',required:'',autocapitalize:'characters',spellcheck:'false',placeholder:'XXXX-XXXX-XXXX'});
 const e=el('div',{class:'e',role:'alert'});
 f.append(el('div',{class:'b'},'Signorelli · Store staff'),el('h1',{},t),el('label',{for:'p'},lab),inp,el('button',{class:'go'},'Open'),e,
  el('div',{class:'n'},k==='me'?'Your code is private and is not saved on this device. Lost it? Ask your shop manager.':'The shop password is the same for front of house and kitchen.'),
  el('button',{type:'button',class:'back',onclick:stepStaff},'← Back'));
 f.onsubmit=async ev=>{ev.preventDefault();const pw=clean(inp.value);
  if(k==='me'){if(pw.length!==12){e.textContent='A code has 12 letters and numbers.';return} try{sessionStorage.setItem('sgcode1',pw)}catch(_){} location.href='me.html';return}
  e.textContent='Checking…';
  try{await check('shop',pw);try{sessionStorage.setItem('sgm',pw);sessionStorage.setItem('sgrole','shop')}catch(_){}
   location.href=url}catch(_){e.textContent='That is not the shop password.'}};
 w.append(f);setTimeout(()=>inp.focus(),50);}
function step2(role){w.innerHTML='';const r=ROLES.find(x=>x[0]===role);
 const f=el('form',{class:'w',style:'margin:0;padding:0'});
 const inp=el('input',{id:'p',autocomplete:'current-password',required:'',autocapitalize:'characters',spellcheck:'false',placeholder:'XXXX-XXXX-XXXX'});
 const e=el('div',{class:'e',role:'alert'});
 f.append(el('div',{class:'b'},'Signorelli · '+r[1]),el('h1',{},r[1]),
  el('label',{for:'p'},role==='shop'?'Shop password, or your personal code':'Password'),inp,el('button',{class:'go'},'Open'),e,
  role==='shop'?el('div',{class:'n'},'Shop password: opens the iPad checklists and the kitchen screen. Your personal code: opens your own bonus page. Lost your code? Ask your shop manager.'):null,
  el('button',{type:'button',class:'back',onclick:step1},'← Someone else is logging in'));
 f.onsubmit=async ev=>{ev.preventDefault();const pw=clean(inp.value);e.textContent='Checking…';
  try{await tryRole(role,pw)}catch(x){
   e.textContent='That password does not open the '+r[1]+' page.'}};
 w.append(f);setTimeout(()=>inp.focus(),50);}
const q=new URLSearchParams(location.search), hk=decodeURIComponent((location.hash||'').slice(1));
if(q.get('switch')){try{sessionStorage.removeItem('sgm');sessionStorage.removeItem('sgrole');sessionStorage.removeItem('sgt')}catch(e){} history.replaceState(null,'',location.pathname);step1();return}
if(hk&&false){location.replace('me.html#'+hk);return}
if(hk){(async()=>{w.append(el('div',{class:'n'},'Opening…'));for(const r of ['owner','manager','shop']){try{await tryRole(r,clean(hk));return}catch(e){}}step1()})();return}
let sp=null,sr=null,stt=0;try{sp=sessionStorage.getItem('sgm');sr=sessionStorage.getItem('sgrole');stt=+sessionStorage.getItem('sgt')||0}catch(e){}
if(sp&&sr!=='shop'&&Date.now()-stt>15*60000){try{sessionStorage.removeItem('sgm');sessionStorage.removeItem('sgrole');sessionStorage.removeItem('sgt')}catch(e){}sp=null;sr=null}
if(sp&&sr==='shop'){stepStaff();return}
if(sp&&sr){tryRole(sr,sp).catch(step1);return}
step1();
})();
